name: Bug report
description: Report reproducible non-security behavior
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not report vulnerabilities or include secrets here; use SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0-dev.3 / commit SHA
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include sanitized output only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands/config with all credentials and private data removed.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - Native Go process
        - CI/test
        - Web prototype
    validations:
      required: true
