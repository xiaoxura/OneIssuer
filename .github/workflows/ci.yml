name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  GOTELEMETRY: "off"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go quality and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
        env:
          POSTGRES_USER: oneissuer
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: oneissuer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oneissuer -d oneissuer"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: 1.26.5
          cache: true
      - name: Install pinned tools
        run: make tools
      - name: Check formatting and generated code
        run: |
          make fmt-check generate-check
          make generate
          git diff --exit-code
      - name: Verify immutable production migrations
        run: make migration-check
      - name: Vet and lint
        run: |
          go vet ./...
          .tools/bin/golangci-lint run ./...
      - name: Log and error privacy regression tests
        run: go test ./internal/observability ./internal/httpserver -run 'Redact|Leak|Privacy' -count=1
      - name: Race-enabled tests
        run: go test -race ./...
      - name: Explicit Phase-four PostgreSQL integration and concurrency suite
        run: go test -run '^TestPostgresIntegration$' -count=1 ./internal/storage/postgres
      - name: Dependency vulnerability scan
        run: GOTELEMETRY=off .tools/bin/govulncheck ./...
      - name: Empty PostgreSQL migration
        env:
          ONEISSUER_DATABASE_URL: postgresql://oneissuer:ci-only-password@127.0.0.1:5432/oneissuer?sslmode=disable
        run: |
          go run ./cmd/oneissuer migrate up
          go run ./cmd/oneissuer migrate up
          go run ./cmd/oneissuer migrate status
      - name: Build static binary
        run: make build

  fuzz:
    name: Phase-four protocol fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: 1.26.5
          cache: true
      - name: Fuzz identity, Client, OIDC query/form, PKCE, JWT, JWK, and redirects
        env:
          ONEISSUER_FUZZ_TIME: 2s
        run: make fuzz-smoke

  contract:
    name: OpenAPI, docs privacy, and migration contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go for pinned actionlint
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: 1.26.5
          cache: true
      - name: Set up Node.js for pinned Redocly
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
      - name: Validate Phase-four public contracts, workflow, and conformance record
        run: make contract-check

  web:
    name: Web prototype
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, type-check, and build
        run: npm run check
      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high --fetch-retries=5 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=10000 --fetch-timeout=30000

  container:
    name: Phase-four Compose, image scan, and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image
        run: |
          docker build \
            --build-arg VERSION=v0.1.0-dev.4 \
            --build-arg COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t oneissuer:ci -t oneissuer:v0.1.0-dev.4 .
      - name: Verify configured and effective non-root user
        run: |
          test "$(docker image inspect oneissuer:ci --format '{{.Config.User}}')" = "65532:65532"
          docker run --rm --entrypoint /bin/sh oneissuer:ci -c 'test "$(id -u)" = "65532"'
      - name: Phase-four empty-volume OIDC Compose acceptance
        run: |
          cp .env.example .env
          make phase-4-smoke
      - name: Generate and validate CycloneDX SBOM
        env:
          ONEISSUER_IMAGE: oneissuer:v0.1.0-dev.4
        run: make sbom
      - name: Scan High and Critical image vulnerabilities
        env:
          ONEISSUER_IMAGE: oneissuer:v0.1.0-dev.4
        run: make container-scan
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oneissuer-v0.1.0-dev.4-supply-chain
          path: .artifacts/supply-chain/
          if-no-files-found: error
          retention-days: 30
